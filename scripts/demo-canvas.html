<!doctype html>
<meta charset="utf-8">
<title>pet-with-you documentation film</title>
<style>body{margin:0}canvas{display:block}</style>
<canvas width="3840" height="2160"></canvas>
<script>
const canvas=document.querySelector('canvas'),ctx=canvas.getContext('2d');
window.drawPlate=async(scene,index,total,card)=>{
  const gradient=ctx.createLinearGradient(0,0,3840,2160);
  gradient.addColorStop(0,'#f5fbff');gradient.addColorStop(.5,'#e8f5ff');gradient.addColorStop(1,'#badcf4');
  ctx.fillStyle=gradient;ctx.fillRect(0,0,3840,2160);
  ctx.fillStyle='#ffffff55';ctx.beginPath();ctx.ellipse(3120,920,1000,1220,-.3,0,Math.PI*2);ctx.fill();
  ctx.strokeStyle='#719bc522';ctx.lineWidth=2;
  for(let x=60;x<3840;x+=120){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,2160);ctx.stroke();}
  const text=(value,x,y,size,color='#174773',font='"Microsoft YaHei", sans-serif')=>{ctx.fillStyle=color;ctx.font=`${size}px ${font}`;ctx.fillText(value,x,y);};
  text('GitHub 开源项目',180,200,55,'#426f95');
  text('pet-with-you',170,390,156,'#103b65','Georgia, serif');
  ctx.fillStyle='#308dc4';ctx.fillRect(180,465,160,12);
  text(scene.kicker,180,680,44,'#3682b1');
  scene.title.split('\n').forEach((line,i)=>text(line,170,850+i*138,104));
  scene.lines.forEach((line,i)=>text(line,180,1250+i*86,49,'#527695'));
  text(String(index+1).padStart(2,'0')+' / '+String(total).padStart(2,'0'),180,1730,40,'#6287a6');
  for(let i=0;i<total;i++){ctx.fillStyle=i===index?'#257cb2':'#aac9df';ctx.fillRect(180+i*72,1790,48,8);}
  if(card){
    const picture=new Image();picture.src=card;await picture.decode();
    const ratio=Math.min(1600/picture.width,930/picture.height);
    const w=picture.width*ratio,h=picture.height*ratio;
    ctx.drawImage(picture,2080+(1600-w)/2,130+(930-h)/2,w,h);
  } else {
    text('陪你工作，也陪你发呆。',2100,730,62,'#467a9f');
    text(scene.animation,2100,850,42,'#6e93ae');
  }
  ctx.strokeStyle='#ffffffaa';ctx.lineWidth=4;ctx.beginPath();ctx.ellipse(2740,1950,560,46,0,0,Math.PI*2);ctx.stroke();
  text('Windows 桌面陪伴  /  二维动画与本项目界面合成',180,2010,34,'#557c9c');
  text('演示数据 · 无模型请求 · 无声',180,2075,32,'#6386a1');
  return canvas.toDataURL('image/png').split(',')[1];
};
</script>
